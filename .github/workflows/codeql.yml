name: "Olmart Security Scan (CodeQL)"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 6 * * 1' # Every Monday at 06:00 UTC

permissions:
  actions: read
  contents: read
  security-events: write

env:
  NODE_OPTIONS: "--no-deprecation"

jobs:
  analyze:
    name: Analyze Code
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript-typescript' ]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

    - name: Initialize CodeQL
      uses: github/codeql-action/init@a0c73122a6231d3a72b4b04036548af1cd2487c9
      with:
        languages: ${{ matrix.language }}
        queries: security-extended

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@a0c73122a6231d3a72b4b04036548af1cd2487c9
      with:
        category: "/language:${{ matrix.language }}"
