name: Automated Security Audit & Vulnerability Check

on:
  schedule:
    # Run daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  security-audit:
    name: Production Vulnerability Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Setup Node.js (v22.23.2)
        uses: actions/setup-node@94196ee1d15439c1b6651cd87ef14e88ec435966
        with:
          node-version: '22.23.2'
          cache: 'npm'

      - name: Enforce Exact npm Version (10.9.4)
        run: npm install -g npm@10.9.4

      - name: Install Clean Dependencies
        timeout-minutes: 5
        run: npm ci

      - name: Execute Security Audit (Production Dependencies - High+)
        timeout-minutes: 3
        run: npm ci && npm audit --omit=dev --audit-level=high

      - name: Execute Full Dependency Audit
        timeout-minutes: 3
        run: npm audit --audit-level=high
