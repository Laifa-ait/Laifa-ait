name: Olmart CI

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  validate:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java (required for Firebase Emulators)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js (via .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install Clean Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || (echo "⚠️ npm ci failed, fallback to npm install..." && npm install)
          else
            echo "⚠️ package-lock.json missing on GitHub runner, executing npm install..."
            npm install
          fi

      - name: Security Audit (Production Dependencies)
        run: npm audit --audit-level=critical --omit=dev || true

      - name: ESLint Code Quality
        run: npm run lint

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Run Vitest Test Suite (with Firebase Emulators)
        run: npx firebase emulators:exec --only firestore,storage "npm test"

      - name: Build Application (SPA + Server)
        run: npm run build
