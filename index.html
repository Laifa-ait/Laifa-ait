        var r = e && e.reason ? (typeof e.reason === "string" ? e.reason : (e.reason.message || String(e.reason))) : "";
        if (r.indexOf("WebSocket") !== -1 || r.indexOf("websocket") !== -1 || r.indexOf("closed without opened") !== -1 || r.indexOf("failed to connect") !== -1) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      });
      window.addEventListener("error", function (e) {
        var m = e && e.message ? e.message : "";
        if (m.indexOf("WebSocket") !== -1 || m.indexOf("websocket") !== -1 || m.indexOf("closed without opened") !== -1) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);
    </script>
